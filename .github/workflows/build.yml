name: Build & Push Monorepo Image (catarie/main)

on:
  push:
    branches: ['release']
  workflow_dispatch:

env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
  ECR_REPO_MAIN: ${{ secrets.ECR_REPO_MAIN }} # e.g. catarie/main
  IMAGE_TAG: prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC AssumeRole)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (main image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.monorepo
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_MAIN }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # (선택) 커밋 SHA 태그도 함께 푸시하려면 주석 해제
      # - name: Also tag with Git SHA
      #   run: |
      #     SRC="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_MAIN }}:${{ env.IMAGE_TAG }}"
      #     SHA="${{ github.sha }}"
      #     docker tag "$SRC" "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_MAIN }}:${SHA}"
      #     docker push "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO_MAIN }}:${SHA}"
