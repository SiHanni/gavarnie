name: Deploy Worker (release)
on:
  workflow_dispatch:
  push:
    branches: [ release ]
    paths:
      - "apps/worker/**"
      - "libs/**"
      - "web/package.json"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/**"
      - ".github/workflows/deploy-worker.yml"
env: { IMAGE_TAG: prod }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    env:
      AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION:         ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_REPO:           ${{ secrets.ECR_REPO_WORKER }}   # ex: catarie/worker
      CLUSTER:            ${{ secrets.ECS_CLUSTER }}
      SERVICE:            ${{ secrets.ECS_SERVICE_WORKER }}# ex: worker-task-service
      REGISTRY:           ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${ECR_REPO}"
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build Worker image (Yarn v4, root context)
        run: |
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
            -f apps/worker/Dockerfile \
            -t ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG} .
      - name: Push Worker image
        run: docker push ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
      - name: Force new deployment
        run: aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
