name: Push Worker Image (release)

on:
  workflow_dispatch:
  push:
    branches: [release]
    paths:
      - 'apps/worker/**'
      - 'libs/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - '.github/workflows/deploy-worker.yml'

env:
  IMAGE_TAG: prod

jobs:
  push:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_REPO: ${{ secrets.ECR_REPO_WORKER }} # 예: catarie/worker
      REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Yarn v4 & install
        run: |
          corepack enable
          corepack prepare yarn@4.9.3 --activate
          yarn --version
          yarn install --immutable --inline-builds

      - name: Build TypeScript (dist 생성)
        run: |
          yarn --cwd libs/entities build
          yarn --cwd libs/logging build
          (yarn --cwd libs/migrations build || true)
          yarn --cwd apps/worker build

      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${ECR_REPO}" --image-scanning-configuration scanOnPush=true

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Worker image (root context)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 \
            -f apps/worker/Dockerfile \
            -t ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG} \
            -t ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}-${SHORT_SHA} \
            .

      - name: Push Worker image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker push ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
          docker push ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG}-${SHORT_SHA}
